<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | Mkhondvo High School
    </title>

    <!-- ADMIN CSS -->
    <link
        rel="stylesheet"
        href="./css/admin.css">

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <!-- SCHOOL LOGO -->

            <div class="login-logo">

                <img
                    src="images/logo.jpg"
                    alt="Mkhondvo High School Logo">

            </div>


            <!-- TITLE -->

            <h1>
                Mkhondvo High School
            </h1>

            <p class="login-subtitle">
                Administration Portal
            </p>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    id="loginButton">

                    Login

                </button>


                <p
                    id="loginError"
                    class="login-error"
                    style="display: none;">

                    Invalid username or password.

                </p>

            </form>


            <!-- FOOTER -->

            <p class="login-footer">

                Mkhondvo High School<br>

                Administration System

            </p>

        </div>

    </main>


    <!-- LOGIN JAVASCRIPT -->

    <script src="./js/login.js"></script>

</body>

</html>
